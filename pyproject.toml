[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nvb-cli"
version = "0.1.0"
description = "CLI to list and use free tier models from NVIDIA Build (build.nvidia.com / NIM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["nvidia", "nim", "llm", "cli", "build.nvidia.com"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
nvb = "nvb_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nvb_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
